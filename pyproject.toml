[project]
name = "nnls-tutorial"
version = "0.1.0"
description = "A tutorial, in Jupyter notebooks, on how non-negative least squares works."
readme = "README.md"
license = "MIT"
authors = [{ name = "Joshua Lynch", email = "joshualynch@yahoo.com" }]
requires-python = ">=3.14"
dependencies = [
    "ipywidgets>=8.1",
    "jupyterlab>=4.6",
    "matplotlib>=3.11",
    "numba>=0.68",
    "numpy>=2.5",
    "pandas>=2.3",
    "scipy>=1.18",
]

[dependency-groups]
dev = [
    "jupytext>=1.19",
    "nbmake>=1.5",
    "nbstripout>=0.8",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# notebooks: imports below the first cell, and long markdown-ish comment lines are fine
"notebooks/*.py" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
